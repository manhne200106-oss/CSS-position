<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Xem Hoạt Hình</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">Cartoon TV</div>

        <nav class="head-link">
            <a href="#">Trang chủ</a>
            <a href="#">Phim mới</a>
            <a href="#">Phim xem nhiều</a>
            <a href="#">Thể loại</a>
        </nav>

        <div class="search">
            <input type="text" placeholder="Tìm kiếm phim...">
            <button>Tìm</button>
        </div>
    </header>

    <div class="content">

        <div class="left-content">
            <h2>Danh sách phim</h2>

            <ul>
                <li><a href="#">Doraemon</a></li>
                <li><a href="#">Tom & Jerry</a></li>
                <li><a href="#">Pokemon</a></li>
                <li><a href="#">Shin - Cậu bé bút chì</a></li>
                <li><a href="#">Thám tử Conan</a></li>
            </ul>
        </div>

        <div class="right-content">
            <h1>Doraemon</h1>

            <div class="video">
                <video controls width="100%">
                    <source src="video.mp4" type="video/mp4">
                    Trình duyệt của bạn không hỗ trợ thẻ video.
                </video>
            </div>

            <h2>Video tham khảo</h2>

            <div class="youtube">
                <iframe
                    src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                    title="YouTube video"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

    </div>

    <footer>
        <p>© 2026 Cartoon TV - Website xem hoạt hình trực tuyến</p>
    </footer>

</body>
</html>
